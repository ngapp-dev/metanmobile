			shellScript = "# Patches the just-built Info.plist with the real ad IDs from secrets.properties (gitignored,\n# local-only - see app/build.gradle.kts for the exact same pattern on the Android side). Runs\n# after Info.plist processing so $INFOPLIST_PATH already exists in the build output; safe to be\n# a no-op (falls back to the checked-in Google test IDs already in Info.plist) if\n# secrets.properties is missing, e.g. on a fresh checkout.\nSECRETS_FILE=\"$SRCROOT/../secrets.properties\"\nINFOPLIST=\"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\n\nif [ -f \"$SECRETS_FILE\" ] && [ -f \"$INFOPLIST\" ]; then\n  ADS_ID_KEY=$(grep -E \"^ADS_ID_KEY=\" \"$SECRETS_FILE\" | head -1 | cut -d\"=\" -f2-)\n  MAIN_BANNER_AD_ID_KEY=$(grep -E \"^MAIN_BANNER_AD_ID_KEY=\" \"$SECRETS_FILE\" | head -1 | cut -d\"=\" -f2-)\n  YANDEX_RU_BANNER_AD_ID_KEY=$(grep -E \"^YANDEX_RU_BANNER_AD_ID_KEY=\" \"$SECRETS_FILE\" | head -1 | cut -d\"=\" -f2-)\n  NATIVE_BANNER_AD_ID_KEY=$(grep -E \"^NATIVE_BANNER_AD_ID_KEY=\" \"$SECRETS_FILE\" | head -1 | cut -d\"=\" -f2-)\n  YANDEX_RU_NATIVE_BANNER_AD_ID_KEY=$(grep -E \"^YANDEX_RU_NATIVE_BANNER_AD_ID_KEY=\" \"$SECRETS_FILE\" | head -1 | cut -d\"=\" -f2-)\n\n  if [ -n \"$ADS_ID_KEY\" ]; then\n    /usr/libexec/PlistBuddy -c \"Set :GADApplicationIdentifier $ADS_ID_KEY\" \"$INFOPLIST\" || true\n  fi\n  if [ -n \"$MAIN_BANNER_AD_ID_KEY\" ]; then\n    /usr/libexec/PlistBuddy -c \"Set :MMMainBannerAdUnitID $MAIN_BANNER_AD_ID_KEY\" \"$INFOPLIST\" || true\n  fi\n  if [ \"$CONFIGURATION\" = \"Release\" ] && [ -n \"$YANDEX_RU_BANNER_AD_ID_KEY\" ]; then\n    /usr/libexec/PlistBuddy -c \"Set :MMYandexRuBannerAdUnitID $YANDEX_RU_BANNER_AD_ID_KEY\" \"$INFOPLIST\" || true\n  fi\n  if [ -n \"$NATIVE_BANNER_AD_ID_KEY\" ]; then\n    /usr/libexec/PlistBuddy -c \"Set :MMNativeBannerAdUnitID $NATIVE_BANNER_AD_ID_KEY\" \"$INFOPLIST\" || true\n  fi\n  if [ \"$CONFIGURATION\" = \"Release\" ] && [ -n \"$YANDEX_RU_NATIVE_BANNER_AD_ID_KEY\" ]; then\n    /usr/libexec/PlistBuddy -c \"Set :MMYandexRuNativeBannerAdUnitID $YANDEX_RU_NATIVE_BANNER_AD_ID_KEY\" \"$INFOPLIST\" || true\n  fi\nfi\n";
