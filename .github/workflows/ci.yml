name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # secrets.properties is gitignored, but the Secrets Gradle plugin fails without it.
      # Real ad unit ids fall back to test ids in core:ui, so placeholders are enough.
      - name: Create stub secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          MAPS_API_KEY=ci-placeholder
          ADS_ID_KEY=ca-app-pub-3940256099942544~3347511713
          METAN_ECOGAS_API=https://example.com/
          GITHUB_BASE_URL=https://example.com/
          EOF

      # google-services.json is gitignored; the Google Services plugin only needs a file
      # with matching package names to build, so CI uses a stub without real keys.
      - name: Create stub google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "metanmobile-ci",
              "storage_bucket": "metanmobile-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.ngapp.metanmobile" }
                },
                "api_key": [{ "current_key": "AIzaSyCI000000000000000000000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.ngapp.metanmobile.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyCI000000000000000000000000000000" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Robolectric downloads an android-all jar per SDK level (~300 MB) the first time a test
      # runs; setup-gradle doesn't cache it, so it was fetched again on every run.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: '**/build/reports/'

  ios:
    name: iOS
    # Xcode 27 is only on the `xcode-27` preview image for now (actions/runner-images#14404);
    # macos-latest tops out at Xcode 26.x. Switch back once macos-latest ships Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The project and its tests are set up with Xcode 27 / iOS 27 (the widget tests target
      # iOS 27). Fails fast here if the runner image doesn't ship it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native toolchain and its dependencies (~1 GB) live in ~/.konan, outside
      # Gradle's cache, and were downloaded again on every run. Keyed on the versions file,
      # which pins the Kotlin version.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Swift packages (Google Mobile Ads, Yandex, AppMetrica, ...) resolved by xcodebuild.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('iosApp/MetanMobile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # secrets.properties is gitignored, but the Secrets Gradle plugin fails without it.
      # Real ad unit ids fall back to test ids in core:ui, so placeholders are enough.
      - name: Create stub secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          MAPS_API_KEY=ci-placeholder
          ADS_ID_KEY=ca-app-pub-3940256099942544~3347511713
          METAN_ECOGAS_API=https://example.com/
          GITHUB_BASE_URL=https://example.com/
          EOF

      - name: Compile shared code for iOS
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      # Kotlin tests of the widget modules on the iOS simulator (the JVM run is in the Android job).
      - name: Widget Kotlin tests (iOS)
        run: ./gradlew :widget:core:iosSimulatorArm64Test :widget:nearest-station:iosSimulatorArm64Test

      # The Swift widget's tests. The test target has no host app, so this doesn't build the
      # app (nor its Kotlin framework) - only the widget's sources and the tests.
      - name: Widget Swift tests
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-27"))
             | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iOS 27 iPhone simulator on this runner"; xcrun simctl list runtimes; exit 1
          fi
          xcodebuild test \
            -project iosApp/MetanMobile.xcodeproj \
            -scheme MetanMobileWidgetTests \
            -destination "id=$UDID" \
            -clonedSourcePackagesDirPath ~/spm-packages \
            -resultBundlePath build/MetanMobileWidgetTests.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            build/MetanMobileWidgetTests.xcresult
            **/build/reports/
